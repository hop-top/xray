name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-typecheck:
    name: build + typecheck (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['26', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --legacy-peer-deps: tree-sitter-kotlin peer-depends on tree-sitter ^0.21
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      # ts-jest is transpile-only (isolatedModules); test files are type-checked here
      - run: npm run typecheck:tests
