name: verify-lockfile

# Fails when .github/workflows/actions.lock is out of sync with the
# workflows, or a locked pin no longer verifies upstream. Delegates to the
# shared hop-top/.github workflow (read-only: `gh actions-lock --verify`).
#
# Regenerate after changing any `uses:` ref: `gh actions-lock` from the
# repository root, with the extension version the shared workflow installs.

on:
  pull_request:
    branches: [next, main, 'release/[0-9]+.[0-9]+']
  push:
    branches: [next, main, 'release/[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify:
    uses: hop-top/.github/.github/workflows/verify-lockfile.yml@d493bd1f094e193ae836324cfe5ffc7773004997 # v0.19.0
